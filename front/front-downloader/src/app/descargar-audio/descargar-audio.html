<div class="div-padre">
  <div class="container" align="center">
    <h3>Descargador de Audio</h3>

    <hr/>

    <p>Ingresa la URL del video que deseas descargar como audio:</p>

    <div class="form-group">
      <input
        class="form-control"
        type="url"
        [(ngModel)]="audioUrl"
        placeholder="https://www.youtube.com/watch?v=..."
        [disabled]="cargando"
      >

            <button (click)="descargar()" [disabled]="!audioUrl || cargando" class="btn btn-dark mt-3 d-inline-flex align-items-center">

        @if (cargando) {
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
          <span role="status">Procesando y Descargando</span>
        } @else {
          Descargar
        }

      </button>
    </div>

    @if (mensajeError) {
      <div class="mt-3 text-danger fw-bold">ERROR</div>
      <ngb-toast header="Algo salió mal" [autohide]="false" (hidden)="close()">
        {{ mensajeError }}
      </ngb-toast>
    }

    <div class="mt-3">
        <p><em>Plataformas soportadas:</em> Youtube y Youtube Music</p>
    </div>

  </div>
</div>
